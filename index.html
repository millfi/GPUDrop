<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FPS Estimator</title>
        <style>
            :root {
                color-scheme: dark;
            }
            body {
                margin: 0;
                font-family:
                    system-ui,
                    -apple-system,
                    sans-serif;
                background: #111;
                color: #ddd;
            }
            h1 {
                font-size: 16px;
                margin: 0 0 8px;
                font-weight: 500;
            }
            input,
            button {
                background: #2a2a2a;
                color: #ddd;
                border: 1px solid #444;
                padding: 4px 8px;
                font: inherit;
            }
            button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }
            .player-controls {
                display: flex;
                gap: 4px;
                flex: 0 0 auto;
            }
            .icon-button {
                width: 32px;
                height: 28px;
                padding: 3px;
            }
            .icon-button svg {
                width: 18px;
                height: 18px;
            }
            canvas {
                display: block;
                max-width: 100%;
                height: auto;
                background: #000;
            }
            #root {
                padding: 12px;
            }
            .controls {
                display: flex;
                gap: 12px;
                align-items: center;
                flex-wrap: wrap;
                margin-bottom: 8px;
            }
            .controls label {
                display: flex;
                gap: 6px;
                align-items: center;
            }
            .video-panel {
                position: relative;
                display: inline-block;
                max-width: 100%;
                background: #000;
            }
            .video-overlay {
                position: absolute;
                left: 8px;
                right: 8px;
                bottom: 8px;
                display: flex;
                gap: 8px;
                align-items: center;
                padding: 6px;
                background: rgb(0 0 0 / 72%);
                border: 1px solid rgb(255 255 255 / 16%);
                box-sizing: border-box;
                transition:
                    opacity 120ms ease,
                    visibility 120ms ease;
            }
            .video-overlay.is-hidden {
                visibility: hidden;
                opacity: 0;
                pointer-events: none;
            }
            .seek-control {
                display: flex;
                gap: 6px;
                align-items: center;
                flex: 1 1 280px;
                min-width: 0;
            }
            .seek-control input {
                flex: 1;
                min-width: 0;
            }
            .seek-control span {
                font-family: ui-monospace, monospace;
                font-size: 12px;
                white-space: nowrap;
            }
            @media (max-width: 700px) {
                .video-overlay {
                    left: 4px;
                    right: 4px;
                    bottom: 4px;
                    gap: 6px;
                    padding: 4px;
                }
                .seek-control span {
                    display: none;
                }
            }
            .stats {
                font-family: ui-monospace, monospace;
                font-size: 12px;
                margin-bottom: 8px;
            }
            .grid {
                display: grid;
                grid-template-columns: minmax(280px, 1fr) 600px minmax(
                        220px,
                        0.65fr
                    );
                align-items: start;
                gap: 12px;
                margin-bottom: 8px;
            }
            .media-column,
            .charts-column,
            .events-column {
                min-width: 0;
            }
            .charts-column {
                display: grid;
                gap: 8px;
            }
            .panel-block {
                margin-top: 8px;
            }
            .events-column {
                display: grid;
                grid-template-rows: auto 1fr;
                align-self: stretch;
            }
            .events {
                max-height: 332px;
                overflow: auto;
                font-family: ui-monospace, monospace;
                font-size: 12px;
                border: 1px solid #333;
                padding: 4px;
            }
            @media (max-width: 1200px) {
                .grid {
                    grid-template-columns: 1fr 1fr;
                }
                .events-column {
                    grid-column: 2;
                }
            }
            @media (max-width: 800px) {
                .grid {
                    grid-template-columns: 1fr;
                }
                .events-column {
                    grid-column: auto;
                }
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
