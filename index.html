<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FPS Estimator</title>
        <style>
            :root {
                color-scheme: light;
            }
            body {
                margin: 0;
                font-family: sans-serif;
                background: #fff;
                color: #24292f;
            }
            h1 {
                font-size: 16px;
                margin: 0 0 8px;
                font-weight: 500;
            }
            input,
            button {
                background: #fff;
                color: #24292f;
                border: 1px solid #b8bec7;
                padding: 4px 8px;
                font: inherit;
            }
            button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }
            .player-controls {
                display: flex;
                gap: 8px;
                flex: 0 0 auto;
                position: relative;
                z-index: 1;
            }
            .icon-button {
                position: relative;
                width: 38px;
                height: 34px;
                padding: 0;
                display: grid;
                place-items: center;
                overflow: hidden;
                border: 1px solid rgb(255 255 255 / 48%);
                border-radius: 999px;
                color: #fff;
                background:
                    linear-gradient(
                        135deg,
                        rgb(255 255 255 / 34%),
                        rgb(255 255 255 / 10%)
                    );
                box-shadow:
                    inset 1px 1px 1px rgb(255 255 255 / 65%),
                    inset -1px -1px 1px rgb(255 255 255 / 24%),
                    0 8px 18px rgb(0 0 0 / 24%);
                backdrop-filter: blur(8px) saturate(1.35);
                cursor: pointer;
                transition:
                    transform 160ms ease,
                    box-shadow 160ms ease,
                    background 160ms ease;
            }
            .icon-button::before {
                content: "";
                position: absolute;
                inset: 0;
                border-radius: inherit;
                pointer-events: none;
                background: rgb(255 255 255 / 18%);
                backdrop-filter: blur(3px);
                filter: url("#gpudrop-glass-distortion");
                opacity: 0.45;
            }
            .icon-button::after {
                content: "";
                position: absolute;
                inset: 1px;
                border-radius: inherit;
                pointer-events: none;
                background:
                    radial-gradient(
                        circle at 30% 20%,
                        rgb(255 255 255 / 54%),
                        transparent 32%
                    ),
                    linear-gradient(
                        160deg,
                        rgb(255 255 255 / 18%),
                        transparent 58%
                    );
                mix-blend-mode: screen;
            }
            .icon-button svg {
                width: 18px;
                height: 18px;
                position: relative;
                z-index: 1;
                filter: drop-shadow(0 1px 1px rgb(0 0 0 / 32%));
            }
            .icon-button:hover:not(:disabled),
            .icon-button:focus-visible:not(:disabled) {
                transform: translateY(-1px) scale(1.03);
                background:
                    linear-gradient(
                        135deg,
                        rgb(255 255 255 / 44%),
                        rgb(255 255 255 / 14%)
                    );
                box-shadow:
                    inset 1px 1px 1px rgb(255 255 255 / 78%),
                    inset -1px -1px 1px rgb(255 255 255 / 30%),
                    0 10px 22px rgb(0 0 0 / 28%);
            }
            .icon-button:active:not(:disabled) {
                transform: translateY(0) scale(0.96);
                box-shadow:
                    inset 2px 2px 3px rgb(0 0 0 / 20%),
                    inset -1px -1px 1px rgb(255 255 255 / 32%),
                    0 5px 12px rgb(0 0 0 / 20%);
            }
            canvas {
                display: block;
                max-width: 100%;
                height: auto;
                background: #000;
            }
            .chart-canvas {
                background: #fff;
                border: 1px solid #d8dee6;
                box-sizing: border-box;
            }
            #root {
                padding: 12px;
            }
            .controls {
                display: flex;
                gap: 12px;
                align-items: center;
                flex-wrap: wrap;
                margin-bottom: 8px;
            }
            .controls label {
                display: flex;
                gap: 6px;
                align-items: center;
            }
            .video-panel {
                position: relative;
                display: inline-block;
                max-width: 100%;
                background: #000;
            }
            .video-stage {
                position: relative;
            }
            .video-panel:fullscreen {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            .video-panel:fullscreen .video-stage {
                width: min(100vw, calc(100vh * var(--video-aspect-ratio)));
                flex: 0 0 auto;
            }
            .video-panel:fullscreen .video-stage > canvas:first-child {
                width: 100%;
            }
            .fullscreen-button {
                flex: 0 0 auto;
            }
            .fullscreen-message {
                position: absolute;
                z-index: 7;
                top: 8px;
                left: 8px;
                right: 8px;
                padding: 8px;
                color: #fff;
                background: rgb(0 0 0 / 80%);
                font-size: 12px;
            }
            .preview-overlay-canvas {
                position: absolute;
                inset: 0;
                z-index: 1;
                width: 100%;
                height: 100%;
                max-width: none;
                background: transparent;
                pointer-events: none;
            }
            .mask-layer {
                position: absolute;
                inset: 0;
                z-index: 3;
                pointer-events: none;
                touch-action: none;
            }
            .mask-layer.is-editing {
                pointer-events: auto;
                cursor: crosshair;
            }
            .mask-rectangle {
                position: absolute;
                box-sizing: border-box;
                border: 2px solid #35b9ff;
                background: rgb(30 144 255 / 22%);
                box-shadow:
                    0 0 0 1px rgb(0 0 0 / 70%),
                    inset 0 0 0 1px rgb(255 255 255 / 35%);
                pointer-events: none;
            }
            .overlay-editor-layer {
                position: absolute;
                inset: 0;
                z-index: 4;
                pointer-events: none;
                touch-action: none;
                overflow: hidden;
            }
            .overlay-editor-layer.is-editing {
                pointer-events: auto;
            }
            .overlay-edit-box {
                position: absolute;
                box-sizing: border-box;
                border: 1px solid rgb(255 255 255 / 90%);
                outline: 1px solid rgb(0 0 0 / 72%);
                background: rgb(255 255 255 / 4%);
                cursor: move;
                user-select: none;
            }
            .overlay-edit-box.is-selected {
                border: 2px solid #ffcc33;
                outline-color: rgb(0 0 0 / 86%);
                box-shadow: 0 0 0 2px rgb(255 204 51 / 24%);
            }
            .overlay-edit-box.is-hidden-element {
                border-style: dashed;
            }
            .overlay-edit-label {
                position: absolute;
                top: 0;
                left: 0;
                max-width: calc(100% - 12px);
                padding: 2px 5px;
                overflow: hidden;
                color: #fff;
                background: rgb(0 0 0 / 74%);
                font-size: 10px;
                line-height: 1.2;
                text-overflow: ellipsis;
                white-space: nowrap;
                pointer-events: none;
            }
            .overlay-resize-handle {
                position: absolute;
                right: -1px;
                bottom: -1px;
                width: 14px;
                height: 14px;
                min-width: 0;
                padding: 0;
                border: 1px solid rgb(0 0 0 / 82%);
                border-radius: 2px 0 0;
                background: #ffcc33;
                cursor: nwse-resize;
                touch-action: none;
            }
            .overlay-settings {
                display: flex;
                flex-wrap: wrap;
                gap: 8px 12px;
                align-items: center;
                margin-top: 8px;
                padding: 8px;
                border: 1px solid #d8dee6;
                border-radius: 4px;
                background: #f6f8fa;
                font-size: 12px;
            }
            .overlay-settings-title {
                flex-basis: 100%;
                font-size: 13px;
                font-weight: 700;
            }
            .overlay-settings label {
                display: inline-flex;
                gap: 5px;
                align-items: center;
                white-space: nowrap;
            }
            .overlay-settings input[type="checkbox"] {
                margin: 0;
                padding: 0;
                accent-color: #159447;
            }
            .overlay-edit-hint {
                flex-basis: 100%;
                color: #5f6b7a;
            }
            .video-overlay {
                position: absolute;
                z-index: 6;
                left: 8px;
                right: 8px;
                bottom: 8px;
                display: flex;
                gap: 12px;
                align-items: center;
                padding: 8px;
                overflow: hidden;
                background:
                    linear-gradient(
                        135deg,
                        rgb(255 255 255 / 22%),
                        rgb(255 255 255 / 7%)
                    );
                border: 1px solid rgb(255 255 255 / 36%);
                border-radius: 24px;
                box-shadow:
                    inset 1px 1px 1px rgb(255 255 255 / 48%),
                    inset -1px -1px 1px rgb(255 255 255 / 18%),
                    0 12px 32px rgb(0 0 0 / 34%);
                backdrop-filter: blur(10px) saturate(1.25);
                box-sizing: border-box;
                transition:
                    opacity 120ms ease,
                    visibility 120ms ease;
            }
            .video-overlay::before,
            .video-overlay::after {
                content: "";
                position: absolute;
                inset: 0;
                border-radius: inherit;
                pointer-events: none;
            }
            .video-overlay::before {
                background: rgb(255 255 255 / 10%);
                backdrop-filter: blur(3px);
                filter: url("#gpudrop-glass-distortion");
                opacity: 0.32;
            }
            .video-overlay::after {
                background:
                    radial-gradient(
                        circle at 12% 10%,
                        rgb(255 255 255 / 36%),
                        transparent 24%
                    ),
                    linear-gradient(
                        165deg,
                        rgb(255 255 255 / 20%),
                        transparent 52%
                    );
                box-shadow:
                    inset 2px 2px 1px rgb(255 255 255 / 34%),
                    inset -1px -1px 1px rgb(255 255 255 / 24%);
            }
            .video-overlay.is-hidden {
                visibility: hidden;
                opacity: 0;
                pointer-events: none;
            }
            .seek-loading {
                position: absolute;
                z-index: 5;
                top: 8px;
                right: 8px;
                width: 32px;
                height: 32px;
                display: grid;
                place-items: center;
                color: #fff;
                background: rgb(0 0 0 / 72%);
                border: 1px solid rgb(255 255 255 / 16%);
                box-sizing: border-box;
                pointer-events: none;
            }
            .seek-loading svg {
                width: 20px;
                height: 20px;
                animation: seek-spin 900ms linear infinite;
            }
            @keyframes seek-spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .seek-control {
                position: relative;
                z-index: 1;
                display: flex;
                gap: 10px;
                align-items: center;
                flex: 1 1 280px;
                min-width: 0;
                color: #fff;
            }
            .seek-control input {
                flex: 1;
                min-width: 0;
                height: 22px;
                padding: 0;
                border: 0;
                background: transparent;
                accent-color: #fff;
                cursor: pointer;
                appearance: none;
            }
            .seek-control span {
                font-family: monospace;
                font-size: 12px;
                white-space: nowrap;
                padding: 4px 8px;
                border: 1px solid rgb(255 255 255 / 28%);
                border-radius: 999px;
                background: rgb(0 0 0 / 18%);
                box-shadow: inset 1px 1px 1px rgb(255 255 255 / 18%);
                text-shadow: 0 1px 1px rgb(0 0 0 / 36%);
            }
            .seek-control input::-webkit-slider-runnable-track {
                height: 8px;
                border: 1px solid rgb(255 255 255 / 36%);
                border-radius: 999px;
                background:
                    linear-gradient(
                        180deg,
                        rgb(255 255 255 / 36%),
                        rgb(255 255 255 / 12%)
                    ),
                    rgb(0 0 0 / 16%);
                box-shadow:
                    inset 1px 1px 1px rgb(255 255 255 / 40%),
                    0 3px 10px rgb(0 0 0 / 18%);
                backdrop-filter: blur(8px);
            }
            .seek-control input::-webkit-slider-thumb {
                appearance: none;
                width: 18px;
                height: 18px;
                margin-top: -6px;
                border: 1px solid rgb(255 255 255 / 70%);
                border-radius: 999px;
                background:
                    radial-gradient(
                        circle at 34% 24%,
                        #fff,
                        rgb(255 255 255 / 62%) 32%,
                        rgb(255 255 255 / 22%) 72%
                    );
                box-shadow:
                    inset 1px 1px 1px rgb(255 255 255 / 84%),
                    0 5px 14px rgb(0 0 0 / 28%);
            }
            .seek-control input::-moz-range-track {
                height: 8px;
                border: 1px solid rgb(255 255 255 / 36%);
                border-radius: 999px;
                background:
                    linear-gradient(
                        180deg,
                        rgb(255 255 255 / 36%),
                        rgb(255 255 255 / 12%)
                    ),
                    rgb(0 0 0 / 16%);
                box-shadow:
                    inset 1px 1px 1px rgb(255 255 255 / 40%),
                    0 3px 10px rgb(0 0 0 / 18%);
            }
            .seek-control input::-moz-range-thumb {
                width: 18px;
                height: 18px;
                border: 1px solid rgb(255 255 255 / 70%);
                border-radius: 999px;
                background:
                    radial-gradient(
                        circle at 34% 24%,
                        #fff,
                        rgb(255 255 255 / 62%) 32%,
                        rgb(255 255 255 / 22%) 72%
                    );
                box-shadow:
                    inset 1px 1px 1px rgb(255 255 255 / 84%),
                    0 5px 14px rgb(0 0 0 / 28%);
            }
            @media (max-width: 700px) {
                .video-overlay {
                    left: 4px;
                    right: 4px;
                    bottom: 4px;
                    gap: 6px;
                    padding: 4px;
                }
                .seek-loading {
                    top: 4px;
                    right: 4px;
                }
                .seek-control span {
                    display: none;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .seek-loading svg {
                    animation-duration: 1.8s;
                }
            }
            .stats {
                font-family: monospace;
                font-size: 12px;
                margin-bottom: 8px;
            }
            .grid {
                display: grid;
                grid-template-columns: minmax(280px, 1fr) 600px minmax(
                        220px,
                        0.65fr
                    );
                align-items: start;
                gap: 12px;
                margin-bottom: 8px;
            }
            .media-column,
            .charts-column,
            .events-column {
                min-width: 0;
            }
            .charts-column {
                display: grid;
                gap: 14px;
            }
            .chart-panel {
                display: grid;
                gap: 6px;
            }
            .chart-title {
                font-size: 13px;
                font-weight: 600;
                color: #24292f;
            }
            .axis-range-control {
                display: grid;
                grid-template-columns: 190px minmax(0, 1fr);
                gap: 12px;
                align-items: start;
                padding: 8px 0 10px;
                border-bottom: 1px solid #e5e7eb;
            }
            .axis-range-copy {
                min-width: 0;
            }
            .axis-range-title {
                font-weight: 700;
                margin-bottom: 3px;
                color: #24292f;
            }
            .axis-range-description {
                color: #5f6b7a;
                font-size: 12px;
                line-height: 1.45;
            }
            .axis-range-fields {
                display: grid;
                gap: 8px;
                min-width: 0;
            }
            .axis-range-slider {
                width: 100%;
                min-width: 0;
                padding: 0;
                border: 0;
                background: transparent;
                accent-color: #1976d2;
            }
            .axis-range-inputs {
                display: flex;
                justify-content: space-between;
                gap: 12px;
            }
            .axis-number {
                width: 112px;
                height: 36px;
                padding: 0 12px;
                border-radius: 4px;
                font-family: monospace;
                font-size: 16px;
                font-weight: 700;
                box-sizing: border-box;
            }
            .panel-block {
                margin-top: 8px;
            }
            .events-column {
                display: grid;
                grid-template-rows: auto 1fr;
                align-self: stretch;
            }
            .events {
                max-height: 332px;
                overflow: auto;
                font-family: monospace;
                font-size: 12px;
                border: 1px solid #d8dee6;
                padding: 4px;
            }
            .event-link {
                display: block;
                width: 100%;
                padding: 2px 4px;
                border: 0;
                background: transparent;
                color: #9fd7ff;
                font: inherit;
                text-align: left;
                cursor: pointer;
            }
            .event-link:hover,
            .event-link:focus-visible {
                background: #eef6ff;
                text-decoration: underline;
            }
            @media (max-width: 1200px) {
                .grid {
                    grid-template-columns: 1fr 1fr;
                }
                .events-column {
                    grid-column: 2;
                }
            }
            @media (max-width: 800px) {
                .grid {
                    grid-template-columns: 1fr;
                }
                .events-column {
                    grid-column: auto;
                }
                .axis-range-control {
                    grid-template-columns: 1fr;
                }
            }
            .encoding-settings { margin: 12px 0; padding: 12px; color: #24292f; background: #f6f8fa; border: 1px solid #b8bec7; border-radius: 8px; }
            .encoding-settings summary { cursor: pointer; font-weight: 600; }
            .encoding-settings fieldset { border: 0; padding: 12px 0 0; margin: 0; min-width: 0; }
            .encoding-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; margin: 12px 0; }
            .encoding-grid label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; min-width: 0; }
            .encoding-grid input, .encoding-grid select { box-sizing: border-box; width: 100%; min-width: 0; padding: 6px; font: inherit; color: #24292f; background: #fff; border: 1px solid #b8bec7; border-radius: 4px; }
            .encoding-grid input::placeholder { color: #5f6b7a; opacity: 1; }
            .encoding-grid input:disabled, .encoding-grid select:disabled { color: #5f6b7a; background: #eaeef2; opacity: 1; cursor: not-allowed; }
            .encoding-grid .encoding-check { flex-direction: row; align-items: center; }
            .encoding-check input { width: auto; }
            .encoding-settings p { font-size: 12px; line-height: 1.6; color: #5f6b7a; }
            .encoding-settings [role="alert"] { color: #b42318; }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
