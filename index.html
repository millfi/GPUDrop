<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FPS Estimator</title>
        <style>
            :root {
                color-scheme: light;
            }
            body {
                margin: 0;
                font-family:
                    system-ui,
                    -apple-system,
                    sans-serif;
                background: #fff;
                color: #24292f;
            }
            h1 {
                font-size: 16px;
                margin: 0 0 8px;
                font-weight: 500;
            }
            input,
            button {
                background: #fff;
                color: #24292f;
                border: 1px solid #b8bec7;
                padding: 4px 8px;
                font: inherit;
            }
            button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }
            .player-controls {
                display: flex;
                gap: 8px;
                flex: 0 0 auto;
                position: relative;
                z-index: 1;
            }
            .icon-button {
                position: relative;
                width: 38px;
                height: 34px;
                padding: 0;
                display: grid;
                place-items: center;
                overflow: hidden;
                border: 1px solid rgb(255 255 255 / 48%);
                border-radius: 999px;
                color: #fff;
                background:
                    linear-gradient(
                        135deg,
                        rgb(255 255 255 / 34%),
                        rgb(255 255 255 / 10%)
                    );
                box-shadow:
                    inset 1px 1px 1px rgb(255 255 255 / 65%),
                    inset -1px -1px 1px rgb(255 255 255 / 24%),
                    0 8px 18px rgb(0 0 0 / 24%);
                backdrop-filter: blur(8px) saturate(1.35);
                cursor: pointer;
                transition:
                    transform 160ms ease,
                    box-shadow 160ms ease,
                    background 160ms ease;
            }
            .icon-button::before {
                content: "";
                position: absolute;
                inset: 0;
                border-radius: inherit;
                pointer-events: none;
                background: rgb(255 255 255 / 18%);
                backdrop-filter: blur(3px);
                filter: url("#gpudrop-glass-distortion");
                opacity: 0.45;
            }
            .icon-button::after {
                content: "";
                position: absolute;
                inset: 1px;
                border-radius: inherit;
                pointer-events: none;
                background:
                    radial-gradient(
                        circle at 30% 20%,
                        rgb(255 255 255 / 54%),
                        transparent 32%
                    ),
                    linear-gradient(
                        160deg,
                        rgb(255 255 255 / 18%),
                        transparent 58%
                    );
                mix-blend-mode: screen;
            }
            .icon-button svg {
                width: 18px;
                height: 18px;
                position: relative;
                z-index: 1;
                filter: drop-shadow(0 1px 1px rgb(0 0 0 / 32%));
            }
            .icon-button:hover:not(:disabled),
            .icon-button:focus-visible:not(:disabled) {
                transform: translateY(-1px) scale(1.03);
                background:
                    linear-gradient(
                        135deg,
                        rgb(255 255 255 / 44%),
                        rgb(255 255 255 / 14%)
                    );
                box-shadow:
                    inset 1px 1px 1px rgb(255 255 255 / 78%),
                    inset -1px -1px 1px rgb(255 255 255 / 30%),
                    0 10px 22px rgb(0 0 0 / 28%);
            }
            .icon-button:active:not(:disabled) {
                transform: translateY(0) scale(0.96);
                box-shadow:
                    inset 2px 2px 3px rgb(0 0 0 / 20%),
                    inset -1px -1px 1px rgb(255 255 255 / 32%),
                    0 5px 12px rgb(0 0 0 / 20%);
            }
            canvas {
                display: block;
                max-width: 100%;
                height: auto;
                background: #000;
            }
            .chart-canvas {
                background: #fff;
                border: 1px solid #d8dee6;
                box-sizing: border-box;
            }
            #root {
                padding: 12px;
            }
            .controls {
                display: flex;
                gap: 12px;
                align-items: center;
                flex-wrap: wrap;
                margin-bottom: 8px;
            }
            .controls label {
                display: flex;
                gap: 6px;
                align-items: center;
            }
            .video-panel {
                position: relative;
                display: inline-block;
                max-width: 100%;
                background: #000;
            }
            .video-overlay {
                position: absolute;
                left: 8px;
                right: 8px;
                bottom: 8px;
                display: flex;
                gap: 12px;
                align-items: center;
                padding: 8px;
                overflow: hidden;
                background:
                    linear-gradient(
                        135deg,
                        rgb(255 255 255 / 22%),
                        rgb(255 255 255 / 7%)
                    );
                border: 1px solid rgb(255 255 255 / 36%);
                border-radius: 24px;
                box-shadow:
                    inset 1px 1px 1px rgb(255 255 255 / 48%),
                    inset -1px -1px 1px rgb(255 255 255 / 18%),
                    0 12px 32px rgb(0 0 0 / 34%);
                backdrop-filter: blur(10px) saturate(1.25);
                box-sizing: border-box;
                transition:
                    opacity 120ms ease,
                    visibility 120ms ease;
            }
            .video-overlay::before,
            .video-overlay::after {
                content: "";
                position: absolute;
                inset: 0;
                border-radius: inherit;
                pointer-events: none;
            }
            .video-overlay::before {
                background: rgb(255 255 255 / 10%);
                backdrop-filter: blur(3px);
                filter: url("#gpudrop-glass-distortion");
                opacity: 0.32;
            }
            .video-overlay::after {
                background:
                    radial-gradient(
                        circle at 12% 10%,
                        rgb(255 255 255 / 36%),
                        transparent 24%
                    ),
                    linear-gradient(
                        165deg,
                        rgb(255 255 255 / 20%),
                        transparent 52%
                    );
                box-shadow:
                    inset 2px 2px 1px rgb(255 255 255 / 34%),
                    inset -1px -1px 1px rgb(255 255 255 / 24%);
            }
            .video-overlay.is-hidden {
                visibility: hidden;
                opacity: 0;
                pointer-events: none;
            }
            .seek-loading {
                position: absolute;
                top: 8px;
                right: 8px;
                width: 32px;
                height: 32px;
                display: grid;
                place-items: center;
                color: #fff;
                background: rgb(0 0 0 / 72%);
                border: 1px solid rgb(255 255 255 / 16%);
                box-sizing: border-box;
                pointer-events: none;
            }
            .seek-loading svg {
                width: 20px;
                height: 20px;
                animation: seek-spin 900ms linear infinite;
            }
            @keyframes seek-spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .seek-control {
                position: relative;
                z-index: 1;
                display: flex;
                gap: 10px;
                align-items: center;
                flex: 1 1 280px;
                min-width: 0;
                color: #fff;
            }
            .seek-control input {
                flex: 1;
                min-width: 0;
                height: 22px;
                padding: 0;
                border: 0;
                background: transparent;
                accent-color: #fff;
                cursor: pointer;
                appearance: none;
            }
            .seek-control span {
                font-family: ui-monospace, monospace;
                font-size: 12px;
                white-space: nowrap;
                padding: 4px 8px;
                border: 1px solid rgb(255 255 255 / 28%);
                border-radius: 999px;
                background: rgb(0 0 0 / 18%);
                box-shadow: inset 1px 1px 1px rgb(255 255 255 / 18%);
                text-shadow: 0 1px 1px rgb(0 0 0 / 36%);
            }
            .seek-control input::-webkit-slider-runnable-track {
                height: 8px;
                border: 1px solid rgb(255 255 255 / 36%);
                border-radius: 999px;
                background:
                    linear-gradient(
                        180deg,
                        rgb(255 255 255 / 36%),
                        rgb(255 255 255 / 12%)
                    ),
                    rgb(0 0 0 / 16%);
                box-shadow:
                    inset 1px 1px 1px rgb(255 255 255 / 40%),
                    0 3px 10px rgb(0 0 0 / 18%);
                backdrop-filter: blur(8px);
            }
            .seek-control input::-webkit-slider-thumb {
                appearance: none;
                width: 18px;
                height: 18px;
                margin-top: -6px;
                border: 1px solid rgb(255 255 255 / 70%);
                border-radius: 999px;
                background:
                    radial-gradient(
                        circle at 34% 24%,
                        #fff,
                        rgb(255 255 255 / 62%) 32%,
                        rgb(255 255 255 / 22%) 72%
                    );
                box-shadow:
                    inset 1px 1px 1px rgb(255 255 255 / 84%),
                    0 5px 14px rgb(0 0 0 / 28%);
            }
            .seek-control input::-moz-range-track {
                height: 8px;
                border: 1px solid rgb(255 255 255 / 36%);
                border-radius: 999px;
                background:
                    linear-gradient(
                        180deg,
                        rgb(255 255 255 / 36%),
                        rgb(255 255 255 / 12%)
                    ),
                    rgb(0 0 0 / 16%);
                box-shadow:
                    inset 1px 1px 1px rgb(255 255 255 / 40%),
                    0 3px 10px rgb(0 0 0 / 18%);
            }
            .seek-control input::-moz-range-thumb {
                width: 18px;
                height: 18px;
                border: 1px solid rgb(255 255 255 / 70%);
                border-radius: 999px;
                background:
                    radial-gradient(
                        circle at 34% 24%,
                        #fff,
                        rgb(255 255 255 / 62%) 32%,
                        rgb(255 255 255 / 22%) 72%
                    );
                box-shadow:
                    inset 1px 1px 1px rgb(255 255 255 / 84%),
                    0 5px 14px rgb(0 0 0 / 28%);
            }
            @media (max-width: 700px) {
                .video-overlay {
                    left: 4px;
                    right: 4px;
                    bottom: 4px;
                    gap: 6px;
                    padding: 4px;
                }
                .seek-loading {
                    top: 4px;
                    right: 4px;
                }
                .seek-control span {
                    display: none;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .seek-loading svg {
                    animation-duration: 1.8s;
                }
            }
            .stats {
                font-family: ui-monospace, monospace;
                font-size: 12px;
                margin-bottom: 8px;
            }
            .grid {
                display: grid;
                grid-template-columns: minmax(280px, 1fr) 600px minmax(
                        220px,
                        0.65fr
                    );
                align-items: start;
                gap: 12px;
                margin-bottom: 8px;
            }
            .media-column,
            .charts-column,
            .events-column {
                min-width: 0;
            }
            .charts-column {
                display: grid;
                gap: 14px;
            }
            .chart-panel {
                display: grid;
                gap: 6px;
            }
            .chart-title {
                font-size: 13px;
                font-weight: 600;
                color: #24292f;
            }
            .axis-range-control {
                display: grid;
                grid-template-columns: 190px minmax(0, 1fr);
                gap: 12px;
                align-items: start;
                padding: 8px 0 10px;
                border-bottom: 1px solid #e5e7eb;
            }
            .axis-range-copy {
                min-width: 0;
            }
            .axis-range-title {
                font-weight: 700;
                margin-bottom: 3px;
                color: #24292f;
            }
            .axis-range-description {
                color: #5f6b7a;
                font-size: 12px;
                line-height: 1.45;
            }
            .axis-range-fields {
                display: grid;
                gap: 8px;
                min-width: 0;
            }
            .axis-range-slider {
                width: 100%;
                min-width: 0;
                padding: 0;
                border: 0;
                background: transparent;
                accent-color: #1976d2;
            }
            .axis-range-inputs {
                display: flex;
                justify-content: space-between;
                gap: 12px;
            }
            .axis-number {
                width: 112px;
                height: 36px;
                padding: 0 12px;
                border-radius: 4px;
                font-family: ui-monospace, monospace;
                font-size: 16px;
                font-weight: 700;
                box-sizing: border-box;
            }
            .panel-block {
                margin-top: 8px;
            }
            .events-column {
                display: grid;
                grid-template-rows: auto 1fr;
                align-self: stretch;
            }
            .events {
                max-height: 332px;
                overflow: auto;
                font-family: ui-monospace, monospace;
                font-size: 12px;
                border: 1px solid #d8dee6;
                padding: 4px;
            }
            .event-link {
                display: block;
                width: 100%;
                padding: 2px 4px;
                border: 0;
                background: transparent;
                color: #9fd7ff;
                font: inherit;
                text-align: left;
                cursor: pointer;
            }
            .event-link:hover,
            .event-link:focus-visible {
                background: #eef6ff;
                text-decoration: underline;
            }
            @media (max-width: 1200px) {
                .grid {
                    grid-template-columns: 1fr 1fr;
                }
                .events-column {
                    grid-column: 2;
                }
            }
            @media (max-width: 800px) {
                .grid {
                    grid-template-columns: 1fr;
                }
                .events-column {
                    grid-column: auto;
                }
                .axis-range-control {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
